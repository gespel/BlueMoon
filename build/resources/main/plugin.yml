name: BlueMoon
version: '1.0-SNAPSHOT'

main: de.heimbrodt.sten.blueMoon.BlueMoon
api-version: '26.2'
load: POSTWORLD
commands:
  home:
    description: Teleportiert dich nach Hause
    usage: /home
  spellcast:
    description: Cast a spell
    usage: /spellcast <SPELLNAME>
  mana:
    description: Shows current mana
    usage: /mana
  bibliothekar:
    description: spawnt einen bibliothekar
    usage: /bibliothekar
  linasdorf:
    description: teleportiert dich zu Linas Dorf
    usage: /linasdorf